<!DOCTYPE html>
<html>
<head>
    <title>Employee Details Form</title>
</head>
<body>

    <div style="border: 1px solid black; padding: 20px; width: 500px;">
        
        <center><h2>Employee Details</h2></center>

        <form>
            <b>01. Personal Information</b>
            <hr>
            <table>
                <tr>
                    <td>Employee Name *<br><input type="text" name="first_name"></td>
                    <td>Last Name<br><input type="text" name="last_name"></td>
                </tr>
                <tr>
                    <td>Starting Date<br><input type="date" name="starting_date"></td>
                    <td>Birth Date<br><input type="date" name="birth_date"></td>
                </tr>
                <tr>
                    <td>Employee Type<br>
                        <select name="employee_type">
                            <option value="">Select</option>
                            <option value="full-time">Full-time</option>
                            <option value="part-time">Part-time</option>
                        </select>
                    </td>
                    <td>Gender<br>
                        <input type="radio" name="gender" value="male"> Male
                        <input type="radio" name="gender" value="female"> Female
                    </td>
                </tr>
                <tr>
                    <td colspan="2">Position<br><input type="text" name="position" style="width: 95%;"></td>
                </tr>
            </table>

            <br>

            <b>02. Location</b>
            <hr>
            <table border="0" width="100%">
                <tr>
                    <td>City<br><input type="text" name="city"></td>
                    <td>State<br><input type="text" name="state"></td>
                </tr>
                <tr>
                    <td>ZIP<br><input type="text" name="zip"></td>
                    <td>Address<br>
                        <textarea name="address" rows="3" style="width: 95%;"></textarea>
                    </td>
                </tr>
            </table>

            <br>

            <b>03. Contact Information</b>
            <hr>
            <table border="0" width="100%">
                <tr>
                    <td>Phone<br><input type="tel" name="phone"></td>
                    <td>Email<br><input type="email" name="email"></td>
                </tr>
            </table>

            <br>
            <center>
                <button type="submit">Register</button>
            </center>
        </form>
    </div>

</body>
</html>
