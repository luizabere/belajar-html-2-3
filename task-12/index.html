<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
</head>
<body>

    <div style="border: 1px solid black; padding: 20px; width: 500px; margin: auto;">
        
        <h2 style="text-align: center;">Create Account</h2>

        <form>
            <table width="100%" cellpadding="5">
                <tr>
                    <td><input type="text" placeholder="First Name" style="width: 100%;"></td>
                    <td><input type="text" placeholder="Last Name" style="width: 100%;"></td>
                </tr>

                <tr>
                    <td colspan="2">
                        <select style="width: 100%;">
                            <option>Country</option>
                            <option>Indonesia</option>
                            <option>Japan</option>
                            <option>South Korea</option>
                            <option>China</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><input type="email" placeholder="Email Address" style="width: 100%;"></td>
                    <td><input type="text" placeholder="Phone Number" style="width: 100%;"></td>
                </tr>

                <tr>
                    <td><input type="password" placeholder="Password" style="width: 100%;"></td>
                    <td><input type="password" placeholder="Confirm Password" style="width: 100%;"></td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="checkbox"> 
                        <label>Terms and Condition</label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center;">
                        <br>
                        <button type="submit">Create</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
